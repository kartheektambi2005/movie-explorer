<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie-Explorer</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-content">

            <h1 class="logo">
                🎬 Movie-Explorer 
                
            </h1>

            <button
                id="themeToggle"
                class="theme-btn"
                aria-label="Toggle Theme"
            >
                🌙
            </button>

        </div>
    </header>

    <!-- Search -->
    <section class="search-section">
        <div class="container">

            <form
                id="searchForm"
                class="search-form"
                novalidate
            >

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search movies..."
                    autocomplete="off"
                    maxlength="100"
                    aria-describedby="searchHint"
                >

                <button type="submit">
                    Search
                </button>

            </form>

            <p
                id="searchHint"
                class="search-hint hidden"
                role="alert"
            ></p>

            <!-- Search History -->
            <div
                id="historyWrapper"
                class="history-wrapper hidden"
            >
                <div class="history-header">
                    <h3>Recent Searches</h3>

                    <button
                        id="clearHistoryBtn"
                        class="link-btn"
                        type="button"
                    >
                        Clear
                    </button>
                </div>

                <div
                    id="searchHistory"
                    class="history-list"
                ></div>
            </div>

        </div>
    </section>

    <!-- Stats -->
    <section class="stats-section">
        <div class="container stats-grid">

            <div class="stat-card">
                <h3>Favorites</h3>
                <p id="favoriteCount" aria-live="polite">0</p>
            </div>

            <div class="stat-card">
                <h3>Watchlist</h3>
                <p id="watchlistCount" aria-live="polite">0</p>
            </div>

        </div>
    </section>

    <!-- Tabs -->
    <section class="tabs-section">
        <div class="container">

            <div class="tabs">

                <button
                    class="tab-btn active"
                    data-tab="movies"
                >
                    Movies
                </button>

                <button
                    class="tab-btn"
                    data-tab="favorites"
                >
                    Favorites
                </button>

                <button
                    class="tab-btn"
                    data-tab="watchlist"
                >
                    Watchlist
                </button>

            </div>

        </div>
    </section>

    <!-- Results -->
    <main class="container">

        <div
            id="moviesGrid"
            class="movies-grid"
        ></div>

        <!-- Loading -->
        <section
            id="loader"
            class="loader hidden"
            role="status"
            aria-live="polite"
        >
            <div class="spinner" aria-hidden="true"></div>
            <span class="sr-only">Loading&hellip;</span>
        </section>

        <!-- Error -->
        <section
            id="errorState"
            class="message hidden"
            role="alert"
        >
            <h2>Something went wrong.</h2>
            <p id="errorMessage"></p>
            <button
                id="retryBtn"
                class="primary-btn"
                type="button"
            >
                Try again
            </button>
        </section>

        <!-- Empty -->
        <section
            id="emptyState"
            class="message hidden"
            role="status"
        >
            <h2 id="emptyTitle">No movies found.</h2>
            <p id="emptyMessage"></p>
        </section>

        <!-- Pagination -->
        <div
            id="loadMoreWrap"
            class="load-more-wrap hidden"
        >
            <button
                id="loadMoreBtn"
                class="primary-btn"
                type="button"
            >
                Load more
            </button>
        </div>

    </main>

    <!-- Movie Details Modal -->
    <div
        id="movieModal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <button
                id="closeModal"
                class="close-btn"
                type="button"
                aria-label="Close Modal"
            >
                &times;
            </button>


            <div
                id="modalBody"
                class="modal-body"
            ></div>

        </div>

    </div>
    <!-- Toast messages -->
    <div
        id="toastRegion"
        class="toast-region"
        role="status"
        aria-live="polite"
    ></div>

    <footer class="footer">
        &copy; 2026 Movie-Explorer by Tambi Kartheek. Data from
        <a
            href="https://www.omdbapi.com/"
            target="_blank"
            rel="noopener noreferrer"
        >OMDb API</a>.
    </footer>

    <script type="module" src="./app.js"></script>

</body>
</html>
