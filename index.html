<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Explorer – Search movies, save favorites and a watchlist</title>

    <meta
        name="description"
        content="Search millions of movies and series with the OMDb API. Read plots, cast and IMDb ratings, and keep your favorites and watchlist in your browser."
    >
    <meta
        name="theme-color"
        content="#1d4ed8"
    >
    <meta
        property="og:title"
        content="Movie Explorer"
    >
    <meta
        property="og:description"
        content="Search movies, read details and keep your favorites and watchlist."
    >
    <meta
        property="og:type"
        content="website"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="./assets/favicon.svg"
    >

    <!-- Apply the saved (or system) theme before first paint so there is no flash. -->
    <script>
        (function () {
            var theme = null;
            try {
                theme = localStorage.getItem("movie_theme");
            } catch (e) { /* storage unavailable */ }
            if (theme !== "dark" && theme !== "light") {
                theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>
<body>

    <a
        class="skip-link"
        href="#main"
    >
        Skip to results
    </a>

    <!-- Everything except the modal and toasts; made inert while the modal is open. -->
    <div id="app">

        <!-- Header -->
        <header class="header">
            <div class="container header-content">

                <h1 class="logo">
                    <span aria-hidden="true">🎬</span> Movie Explorer
                </h1>

                <button
                    id="themeToggle"
                    class="theme-btn"
                    type="button"
                    aria-label="Switch to dark theme"
                >
                    🌙
                </button>

            </div>
        </header>

        <!-- Banner: recent Indian releases, filled in by js/banner.js -->
        <section
            id="banner"
            class="banner is-loading"
            aria-roledescription="carousel"
            aria-label="Recently released movies in India"
        >
            <div
                class="banner-skeleton"
                aria-hidden="true"
            ></div>
        </section>

        <!-- Search -->
        <section
            class="search-section"
            aria-label="Search"
        >
            <div class="container">

                <form
                    id="searchForm"
                    class="search-form"
                    role="search"
                    novalidate
                >

                    <label
                        for="searchInput"
                        class="sr-only"
                    >
                        Search movies by title
                    </label>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search movies, e.g. Inception"
                        autocomplete="off"
                        maxlength="100"
                        aria-describedby="searchHint"
                    >

                    <button type="submit">
                        Search
                    </button>

                </form>

                <p
                    id="searchHint"
                    class="search-hint hidden"
                    role="alert"
                ></p>

                <!-- Search History -->
                <div
                    id="historyWrapper"
                    class="history-wrapper hidden"
                >
                    <div class="history-header">
                        <h2>Recent Searches</h2>

                        <button
                            id="clearHistoryBtn"
                            class="link-btn"
                            type="button"
                        >
                            Clear
                        </button>
                    </div>

                    <div
                        id="searchHistory"
                        class="history-list"
                    ></div>
                </div>

            </div>
        </section>

        <!-- Stats -->
        <section
            class="stats-section"
            aria-label="Your lists"
        >
            <div class="container stats-grid">

                <div class="stat-card">
                    <h2>Favorites</h2>
                    <p
                        id="favoriteCount"
                        aria-live="polite"
                    >0</p>
                </div>

                <div class="stat-card">
                    <h2>Watchlist</h2>
                    <p
                        id="watchlistCount"
                        aria-live="polite"
                    >0</p>
                </div>

            </div>
        </section>

        <!-- Tabs -->
        <nav
            class="tabs-section"
            aria-label="Movie lists"
        >
            <div class="container">

                <div class="tabs">

                    <button
                        class="tab-btn active"
                        type="button"
                        data-tab="movies"
                        aria-pressed="true"
                    >
                        Movies
                    </button>

                    <button
                        class="tab-btn"
                        type="button"
                        data-tab="favorites"
                        aria-pressed="false"
                    >
                        Favorites
                    </button>

                    <button
                        class="tab-btn"
                        type="button"
                        data-tab="watchlist"
                        aria-pressed="false"
                    >
                        Watchlist
                    </button>

                </div>

            </div>
        </nav>

        <!-- Results -->
        <main
            id="main"
            class="container"
            tabindex="-1"
        >

            <h2 class="sr-only">Results</h2>

            <p
                id="resultsSummary"
                class="results-summary hidden"
                role="status"
                aria-live="polite"
            ></p>

            <div
                id="moviesGrid"
                class="movies-grid"
            ></div>

            <!-- Loading -->
            <section
                id="loader"
                class="loader hidden"
                role="status"
                aria-live="polite"
            >
                <div
                    class="spinner"
                    aria-hidden="true"
                ></div>
                <span class="sr-only">Loading&hellip;</span>
            </section>

            <!-- Error -->
            <section
                id="errorState"
                class="message hidden"
                role="alert"
            >
                <h2>Something went wrong.</h2>
                <p id="errorMessage"></p>
                <button
                    id="retryBtn"
                    class="primary-btn"
                    type="button"
                >
                    Try again
                </button>
            </section>

            <!-- Empty -->
            <section
                id="emptyState"
                class="message hidden"
                role="status"
            >
                <h2 id="emptyTitle">No movies found.</h2>
                <p id="emptyMessage"></p>
            </section>

            <!-- Pagination -->
            <div
                id="loadMoreWrap"
                class="load-more-wrap hidden"
            >
                <button
                    id="loadMoreBtn"
                    class="primary-btn"
                    type="button"
                >
                    Load more
                </button>
            </div>

            <noscript>
                <p class="message">Movie Explorer needs JavaScript to search movies.</p>
            </noscript>

        </main>

        <footer class="footer">
            &copy; 2026 Movie Explorer by Tambi Kartheek. Data from
            <a
                href="https://www.omdbapi.com/"
                target="_blank"
                rel="noopener noreferrer"
            >OMDb API</a>.
        </footer>

    </div>

    <!-- Movie Details Modal -->
    <div
        id="movieModal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <button
                id="closeModal"
                class="close-btn"
                type="button"
                aria-label="Close details"
            >
                <span aria-hidden="true">&times;</span>
            </button>

            <div
                id="modalBody"
                class="modal-body"
            ></div>

        </div>

    </div>

    <!-- Toast messages -->
    <div
        id="toastRegion"
        class="toast-region"
        role="status"
        aria-live="polite"
    ></div>

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>
</html>
